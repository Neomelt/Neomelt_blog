<!DOCTYPE html>
<!-- Hand-written stand-in for https://t.me/s/<channel>: same class names and
     nesting as the real preview, invented content. Kept out of Prettier on
     purpose: the real page is compact, and reflowing it would add whitespace
     inside message text that Telegram never sends. -->
<html>
  <head><meta charset="utf-8" /><title>Test Channel – Telegram</title></head>
  <body>
    <main>
      <section class="tgme_channel_history js-message_history">
        <div class="tgme_widget_message_centered js-messages_more_wrap">
          <a href="/s/test_log?before=100" class="tme_messages_more js-messages_more" data-before="100"></a>
        </div>

        <div class="tgme_widget_message_wrap js-widget_message_wrap">
          <div class="tgme_widget_message service_message js-widget_message" data-post="test_log/101">
            <div class="tgme_widget_message_bubble">
              <div class="tgme_widget_message_text js-message_text">Channel photo updated</div>
              <div class="tgme_widget_message_footer"><a class="tgme_widget_message_date" href="https://t.me/test_log/101"><time datetime="2026-01-01T00:00:00+00:00" class="time">00:00</time></a></div>
            </div>
          </div>
        </div>

        <div class="tgme_widget_message_wrap js-widget_message_wrap">
          <div class="tgme_widget_message text_not_supported_wrap js-widget_message" data-post="test_log/102">
            <div class="tgme_widget_message_bubble">
              <div class="tgme_widget_message_forwarded_from accent_color">Forwarded from <a class="tgme_widget_message_forwarded_from_name" href="https://t.me/other_channel"><span dir="auto">Other Channel</span></a></div>
              <div class="tgme_widget_message_reply">
                <div class="tgme_widget_message_text js-message_text">quoted text that is not ours</div>
              </div>
              <a class="tgme_widget_message_photo_wrap 1 2" href="https://t.me/test_log/102" style="width:800px;background-image:url('https://cdn4.telesco.pe/file/PHOTO_ONE.jpg')">
                <div class="tgme_widget_message_photo" style="padding-top:75%"></div>
              </a>
              <div class="tgme_widget_message_text js-message_text" dir="auto">Hello <b>bold</b> <i class="emoji" style="background-image:url('//telegram.org/img/emoji/40/F09F988A.png')"><b>😊</b></i><br/>line two <a href="?q=%23diary">#diary</a> <a href="javascript:alert(1)">bad</a> <a href="https://example.com/x" onclick="steal()">ok</a><script>alert(1)</script><span class="tg-spoiler">secret</span></div>
              <div class="tgme_widget_message_reactions js-message_reactions"><span class="tgme_reaction"><i class="emoji" style="background-image:url('//telegram.org/img/emoji/40/E29DA4.png')"><b>❤</b></i>3</span><span class="tgme_reaction"><i class="emoji"><b>👍</b></i>1</span></div>
              <div class="tgme_widget_message_footer compact js-message_footer">
                <div class="tgme_widget_message_info short js-message_info">
                  <span class="tgme_widget_message_views">1.2K</span><span class="copyonly"> views</span><span class="tgme_widget_message_meta"><span class="tgme_widget_message_from_author" dir="auto">Author</span>,&nbsp;edited &nbsp;<a class="tgme_widget_message_date" href="https://t.me/test_log/102"><time datetime="2026-02-03T04:05:06+00:00" class="time">04:05</time></a></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="tgme_widget_message_wrap js-widget_message_wrap">
          <div class="tgme_widget_message js-widget_message" data-post="test_log/103">
            <div class="tgme_widget_message_bubble">
              <div class="tgme_widget_message_grouped_wrap">
                <a class="tgme_widget_message_photo_wrap grouped_media_wrap" href="https://t.me/test_log/103" style="width:200px;height:200px;background-image:url('https://cdn5.telesco.pe/file/ALBUM_A.jpg')"></a>
                <a class="tgme_widget_message_photo_wrap grouped_media_wrap" href="https://t.me/test_log/104" style="width:200px;height:200px;background-image:url('https://cdn5.telesco.pe/file/ALBUM_B.jpg')"></a>
                <a class="tgme_widget_message_photo_wrap grouped_media_wrap" href="https://t.me/test_log/105" style="width:200px;height:200px;background-image:url(&quot;https://cdn5.telesco.pe/file/ALBUM_C.jpg&quot;)"></a>
              </div>
              <a class="tgme_widget_message_video_player" href="https://t.me/test_log/103?single">
                <i class="tgme_widget_message_video_thumb" style="background-image:url('https://cdn5.telesco.pe/file/VIDEO_THUMB.jpg')"></i>
                <div class="message_video_play"></div>
                <time class="message_video_duration js-message_video_duration">0:42</time>
              </a>
              <a class="tgme_widget_message_link_preview" href="https://example.org/article">
                <div class="link_preview_site_name accent_color" dir="auto">Example</div>
                <div class="link_preview_title" dir="auto">An Article</div>
                <div class="link_preview_description" dir="auto">What it is about</div>
              </a>
              <div class="tgme_widget_message_footer compact js-message_footer">
                <div class="tgme_widget_message_info short js-message_info">
                  <span class="tgme_widget_message_views">7</span><span class="tgme_widget_message_meta"><a class="tgme_widget_message_date" href="https://t.me/test_log/103"><time datetime="2026-02-04T10:00:00+00:00" class="time">10:00</time></a></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="tgme_widget_message_wrap js-widget_message_wrap">
          <div class="tgme_widget_message js-widget_message" data-post="test_log/106">
            <div class="tgme_widget_message_bubble">
              <div class="tgme_widget_message_sticker_wrap"></div>
              <div class="tgme_widget_message_footer"><a class="tgme_widget_message_date" href="https://t.me/test_log/106"><time datetime="2026-02-05T10:00:00+00:00" class="time">10:00</time></a></div>
            </div>
          </div>
        </div>
      </section>

      <section class="tgme_right_column">
        <div class="tgme_channel_info">
          <div class="tgme_channel_info_header">
            <i class="tgme_page_photo_image bgcolor2" data-content="T"><img src="https://cdn5.telesco.pe/file/AVATAR.jpg" /></i>
            <div class="tgme_channel_info_header_title_wrap"><div class="tgme_channel_info_header_title"><span dir="auto">Test Channel</span></div></div>
            <div class="tgme_channel_info_header_username"><a href="https://t.me/test_log">@test_log</a></div>
          </div>
          <div class="tgme_channel_info_counters">
            <div class="tgme_channel_info_counter"><span class="counter_value">1.5K</span> <span class="counter_type">subscribers</span></div>
            <div class="tgme_channel_info_counter"><span class="counter_value">42</span> <span class="counter_type">photos</span></div>
          </div>
          <div class="tgme_channel_info_description">A test channel</div>
        </div>
      </section>
    </main>
  </body>
</html>
