<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ecc"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e57"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2452f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#ffffff"/>

  <!-- Panel 1: the problem -->
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2430">① 问题的根源：NAT 之后，谁都无法"被连入"</text>

  <rect x="34" y="56" width="230" height="130" rx="12" fill="#eefaf0" stroke="#2f9e57" stroke-width="1.8"/>
  <text x="149" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">家里的笔记本</text>
  <text x="149" y="108" text-anchor="middle" font-size="12" font-family="monospace" fill="#5a6270">192.168.1.23</text>
  <text x="149" y="130" text-anchor="middle" font-size="11.5" fill="#5a6270">私网地址 · 全球不可路由</text>
  <text x="149" y="152" text-anchor="middle" font-size="11.5" fill="#5a6270">IPv4 枯竭的产物：</text>
  <text x="149" y="170" text-anchor="middle" font-size="11.5" fill="#5a6270">大家共享少数公网出口</text>

  <rect x="696" y="56" width="230" height="130" rx="12" fill="#eef4ff" stroke="#3b6ecc" stroke-width="1.8"/>
  <text x="811" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">远端主机</text>
  <text x="811" y="108" text-anchor="middle" font-size="12" font-family="monospace" fill="#5a6270">10.0.10.95</text>
  <text x="811" y="130" text-anchor="middle" font-size="11.5" fill="#5a6270">同样躲在 NAT/防火墙后</text>
  <text x="811" y="152" text-anchor="middle" font-size="11.5" fill="#5a6270">没有公网 IP</text>
  <text x="811" y="170" text-anchor="middle" font-size="11.5" fill="#5a6270">路由器也不归你管</text>

  <rect x="306" y="76" width="90" height="90" rx="10" fill="#f4f6f9" stroke="#5a6270" stroke-width="1.5"/>
  <text x="351" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2430">NAT A</text>
  <text x="351" y="132" text-anchor="middle" font-size="10.5" fill="#5a6270">只放行出站</text>
  <text x="351" y="148" text-anchor="middle" font-size="10.5" fill="#5a6270">及其回包</text>

  <rect x="564" y="76" width="90" height="90" rx="10" fill="#f4f6f9" stroke="#5a6270" stroke-width="1.5"/>
  <text x="609" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2430">NAT B</text>
  <text x="609" y="132" text-anchor="middle" font-size="10.5" fill="#5a6270">无映射表项的</text>
  <text x="609" y="148" text-anchor="middle" font-size="10.5" fill="#5a6270">入站包直接丢</text>

  <path d="M 266 100 L 302 100" fill="none" stroke="#2f9e57" stroke-width="2.2" marker-end="url(#ag)"/>
  <path d="M 400 100 L 560 100" fill="none" stroke="#c2452f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="480" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#c2452f">✗ 主动连入被 NAT B 丢弃</text>
  <path d="M 692 140 L 658 140" fill="none" stroke="#3b6ecc" stroke-width="2.2" marker-end="url(#ab)"/>
  <path d="M 560 140 L 404 140" fill="none" stroke="#c2452f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="480" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#c2452f">✗ 反方向同样被 NAT A 丢弃</text>

  <!-- Panel 2: the derivation -->
  <line x1="34" y1="212" x2="926" y2="212" stroke="#d8dde4" stroke-width="1.5"/>
  <text x="480" y="244" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2430">② 解法推导：出站永远是允许的 → 让"两个出站"在中间相遇</text>

  <!-- coordination -->
  <rect x="390" y="268" width="180" height="74" rx="12" fill="#fff7e8" stroke="#d9962e" stroke-width="1.8"/>
  <text x="480" y="294" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a5a10">协调服务（控制面）</text>
  <text x="480" y="314" text-anchor="middle" font-size="11" fill="#8a5a10">双方都主动连它（出站）</text>
  <text x="480" y="330" text-anchor="middle" font-size="11" fill="#8a5a10">交换公钥 + 公网映射地址</text>

  <rect x="60" y="286" width="150" height="46" rx="10" fill="#eefaf0" stroke="#2f9e57" stroke-width="1.6"/>
  <text x="135" y="314" text-anchor="middle" font-size="13" fill="#1f2430">笔记本</text>
  <rect x="750" y="286" width="150" height="46" rx="10" fill="#eef4ff" stroke="#3b6ecc" stroke-width="1.6"/>
  <text x="825" y="314" text-anchor="middle" font-size="13" fill="#1f2430">远端主机</text>

  <path d="M 212 300 L 386 300" fill="none" stroke="#2f9e57" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M 748 300 L 574 300" fill="none" stroke="#3b6ecc" stroke-width="2" marker-end="url(#ab)"/>
  <text x="298" y="290" text-anchor="middle" font-size="11" fill="#14713d">出站 ✓</text>
  <text x="662" y="290" text-anchor="middle" font-size="11" fill="#1a4fa0">出站 ✓</text>

  <!-- hole punch -->
  <rect x="60" y="376" width="840" height="66" rx="10" fill="#f0f7f1" stroke="#2f9e57" stroke-width="1.4"/>
  <text x="480" y="402" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14713d">NAT 打洞：双方同时向"对方的公网映射地址"发包</text>
  <text x="480" y="424" text-anchor="middle" font-size="12" fill="#3d6e4d">各自的 NAT 都认为这是"自己人发起的出站"，回包放行 → 表项建立 → 之后就是点对点直连（WireGuard 加密）</text>

  <!-- fallback -->
  <rect x="60" y="458" width="840" height="54" rx="10" fill="#f5f0fa" stroke="#8a63c9" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="480" y="480" text-anchor="middle" font-size="13" font-weight="600" fill="#5b3f8f">兜底：打洞失败（少数严苛 NAT）→ 双方都"出站"连中继（DERP），由它转发加密流量</text>
  <text x="480" y="500" text-anchor="middle" font-size="11.5" fill="#7a6699">因为只依赖出站，这条路永远走得通——代价是多一跳延迟；中继只经手密文</text>
</svg>
